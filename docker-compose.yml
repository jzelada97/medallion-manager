# HR Insights ETL — full stack.
# NOTE: the Kafka broker/generator is provided separately (black box) and runs from
# its own docker-compose. This app connects to it over the network. Set
# KAFKA_BOOTSTRAP_SERVERS accordingly (e.g. host.docker.internal:9092 on Docker Desktop).

services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-hr_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
    volumes:
      - mongo_data:/data/db
    networks: [hr_net]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hr_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-hr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [hr_net]

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}"]
    networks: [hr_net]

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    env_file: .env
    depends_on: [mongo, postgres, redis]
    networks: [hr_net]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on: [postgres]
    networks: [hr_net]

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on: [api]
    networks: [hr_net]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [app, api]
    networks: [hr_net]

volumes:
  mongo_data:
  pg_data:

networks:
  hr_net:
    driver: bridge
