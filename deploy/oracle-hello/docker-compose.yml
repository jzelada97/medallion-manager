# Minimal "hello world" to REHEARSE the Oracle VM deploy flow end to end before
# doing the full stack (or your own productivity app). One tiny web app + Caddy HTTPS.
#
# On the VM:
#   cd deploy/oracle-hello
#   DOMAIN=<PUBLIC_IP>.nip.io docker compose up -d
# Then open https://<PUBLIC_IP>.nip.io
#
# This exercises the exact same OCI muscles as the real deploy:
#   account -> VM -> security list 80/443 -> VM firewall -> DNS/nip.io -> HTTPS.

services:
  web:
    image: nginxdemos/hello:plain-text
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN} --to web:80
    restart: unless-stopped

# Note: `caddy reverse-proxy` auto-manages HTTPS for the given hostname.
